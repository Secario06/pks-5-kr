services:
  # PostgreSQL с автоматической загрузкой схемы и тестовых данных
  # из database/schema.sql при первом запуске (пустой volume).
  db:
    image: postgres:16-alpine
    container_name: yoga-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: yoga_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yoga_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Консольное Java-приложение. Запускается интерактивно отдельной
  # командой (см. README.md) — обычный `docker compose up` не даёт
  # удобно работать с stdin сразу нескольких сервисов.
  app:
    build: .
    container_name: yoga-studio-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/yoga_studio
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./export:/app/export
    stdin_open: true
    tty: true

volumes:
  db_data:
